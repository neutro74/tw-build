<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection Test</title>
<style>
  :root { --bg: #10131c; --panel: #1a1f2c; --text: #e8ecf4; --dim: #8a93a8; --ok: #5fd068; --bad: #ff5f6d; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  p { color: var(--dim); margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
  th, td { padding: 7px 10px; text-align: left; border-top: 1px solid #262c3b; }
  th { color: var(--dim); font-weight: 500; border-top: 0; }
  #log { background: var(--panel); border-radius: 8px; padding: 10px 12px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .ok { color: var(--ok); } .bad { color: var(--bad); }
  #relays { font: 13px ui-monospace, monospace; color: var(--dim); }
  button { font: inherit; padding: 9px 16px; border: 0; border-radius: 6px; background: #3b6cf0; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Two-device connection test</h1>
  <p>Open this page on two devices (or more). They find each other automatically and try to connect directly. Leave both open for a minute.</p>
  <p>You are <b id="me"></b> · devices connected: <b id="count">0</b></p>
  <div id="relays">connecting to discovery relays…</div>
  <h2>Connected devices</h2>
  <table><thead><tr><th>Device</th><th>Type</th><th>Route (me → them)</th><th>Ping</th></tr></thead><tbody id="peers"></tbody></table>
  <h2>Log</h2>
  <button id="copy">Copy results</button>
  <div id="log" style="margin-top:10px"></div>
</main>
<script src="p2p-test.js"></script>
</body>
</html>
